[workspace]
resolver = "3"
members = ["crates/math-core", "crates/math-judge", "crates/mathia-cli", "src-tauri"]
# Plain `cargo build` / `cargo test` leave the desktop app (and Tauri's system
# dependencies) out; use `-p mathia-app` or `--workspace` to include it.
default-members = ["crates/math-core", "crates/math-judge", "crates/mathia-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Mathia contributors"]

[workspace.dependencies]
math-core = { path = "crates/math-core" }
math-judge = { path = "crates/math-judge" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
askama = "0.16"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
serde_json = "1"
regex = "1"
