[project]
name = "mathia-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Farnam Jahangard", email = "farnamjahangard@gmail.com" }
]
requires-python = ">=3.11, <3.13"
dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.14.4",
    "scikit-learn>=1.9.1",
    "seqeval>=1.2.2",
    "sklearn-crfsuite>=0.5.0",
]

[project.scripts]
mathia-ml = "mathia_ml:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
