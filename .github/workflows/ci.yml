name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Vendor KaTeX and Vazirmatn (pinned, checksummed)
        run: |
          ./scripts/vendor-katex.sh
          ./scripts/vendor-fonts.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: math-core without bundled assets
        run: cargo test -p math-core
      - run: cargo test --workspace

  runtime:
    name: Runtime (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendor KaTeX and Vazirmatn
        run: |
          ./scripts/vendor-katex.sh
          ./scripts/vendor-fonts.sh
      - name: Build the CLI the tests drive
        run: cargo build -p mathia
      - working-directory: tests/js
        run: npm ci
      - working-directory: tests/js
        run: npm test
