name: Release

# Builds the desktop app for macOS, Windows and Linux when a version tag is
# pushed, and attaches the bundles to a draft GitHub release.
#
# Signing is optional and only happens when the secrets exist:
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, and for notarisation APPLE_ID,
#            APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#   Windows: sign with your own certificate; see the Tauri signing guide.
# Without them the bundles are unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]

          def norm(value):
              parts = (value[1:] if value.startswith("v") else value).split(".")
              parts += ["0"] * (3 - len(parts))
              return tuple(int(part) for part in parts[:3])

          if norm(tag) != norm(version):
              raise SystemExit(
                  f"::error::Tag {tag} does not match the workspace version {version}. "
                  "Bump [workspace.package].version in Cargo.toml before tagging."
              )
          print(f"tag {tag} matches version {version}")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Vendor KaTeX and Vazirmatn
        shell: bash
        run: |
          ./scripts/vendor-katex.sh
          ./scripts/vendor-fonts.sh
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add the updater private key as a repository secret (see README: Auto-updates)."
            exit 1
          fi
      - name: Build bundles
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: src-tauri
        run: |
          # Tauri tries to sign whenever these are set, even when empty, so
          # drop the ones whose secrets do not exist.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          cargo tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mathia-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.zip
            target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Build updater manifest
        run: |
          python3 scripts/make-latest-json.py \
            --dir dist \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
