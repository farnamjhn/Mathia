[package]
name = "mathia-app"
description = "Mathia desktop app (Tauri v2): a thin shell over math-core."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
# KaTeX and Vazirmatn are always bundled: the app has no --katex-dir and
# never uses a CDN.
math-judge.workspace = true
math-core = { workspace = true, features = ["bundled-katex", "bundled-fonts"] }
serde.workspace = true
serde_json.workspace = true
tauri = "2"
tauri-plugin-dialog = "2"

# Dock icon that follows the system appearance (src/dock.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSApplication", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSUserDefaults"] }
